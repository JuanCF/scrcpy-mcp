# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit AI code review configuration for scrcpy-mcp
# See: https://docs.coderabbit.ai/guides/configure-coderabbit

language: en-US
early_access: false

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  commit_status: true
  changed_files_summary: true
  suggested_labels: false

  path_filters:
    - "!dist/**"
    - "!node_modules/**"
    - "!package-lock.json"
    - "!icon.png"
    - "!manifest.json"
    # Host-side capture artifacts (audio recordings default to the cwd)
    - "!**/*.wav"
    - "!**/*.opus"
    - "!**/*.mp4"

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    base_branches:
      - main

  tools:
    eslint:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    gitleaks:
      enabled: true

  path_instructions:
    - path: "src/**/*.ts"
      instructions: |
        Review TypeScript source with these project conventions in mind:
        - ESM imports with `.js` extension for local modules
        - No semicolons; 2-space indentation
        - Max ~100 chars per line applies to code only. The `max-len` rule in
          eslint.config.js sets ignoreStrings, ignoreTemplateLiterals, ignoreUrls
          and ignoreRegExpLiterals, so long single-line tool `description` and
          `.describe()` strings are intentional and must not be flagged as
          length violations. `npm run lint` is the authority on formatting.
        - camelCase for functions/variables, PascalCase for types, snake_case for tool names
        - Prefer `async/await`, early returns, and minimal changes
        - MCP tool registrations must include `inputSchema`, `outputSchema`, `annotations`, and `structuredContent`
        - Keep `console.error()` for server-side logging only; never write plain text to stdout
        - Preserve ADB fallback paths alongside the scrcpy fast path
        - Host binaries (adb, scrcpy, ffmpeg, ffplay) may be configured as a
          bare command name, which is resolved through PATH. Never `statSync`
          a bare name — it resolves against the cwd and reports an installed
          binary as missing.
        - A socket read that consumes a header must leave the socket paused
          when it is done. A flowing socket with no `data` listener silently
          discards what arrives before the next consumer attaches, which costs
          the h264 config packet and the first audio chunks.
    - path: "src/{tools,utils}/audio.ts"
      instructions: |
        Audio capture specifics:
        - Requires Android 11+ (SDK 30); a session without audio is still valid
          for video, input, and clipboard, so degrade rather than fail
        - The `output` source (REMOTE_SUBMIX) MOVES audio to the host and mutes
          the device; only `playback` + `audioDup` (Android 13+) keeps it
          audible. Keep `deviceMuted` in responses honest about which applies.
        - The audio hub fans one socket out to several sinks (playback,
          recording): a sink must never block or throw into the socket path,
          and detaching one must leave the others running
        - Sinks own an ffmpeg/ffplay child: handle EPIPE on stdin, give ffmpeg
          time to finalise the container on stop, and do not log an expected
          shutdown as an error
        - Recordings are written to the HOST filesystem, unlike `screen_record_*`
    - path: "tests/**/*.ts"
      instructions: |
        Ensure tests cover both scrcpy and ADB fallback paths where applicable and that assertions match the structured response format (`success`, `message`, `structuredContent`, etc.).
    - path: "*.md"
      instructions: |
        Verify docs stay in sync with the source (e.g., tool counts, project structure, environment variables, and response schemas).
        Check too that documented tool options match the Zod `inputSchema` (names, defaults, and units — `screenOffTimeout` is in seconds), that host
        prerequisites stay accurate (ffmpeg for decoding and recording, ffplay for the viewer window and audio playback), and that the Android version
        floor for audio (11+) and the device-muting caveat are not dropped.

  pre_merge_checks:
    title:
      mode: warning
      requirements: "Use conventional commit format: type: short summary (max 72 chars)."

chat:
  auto_reply: true
