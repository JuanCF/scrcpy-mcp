name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild esbuild binary
        run: npm rebuild esbuild --ignore-scripts=false

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild esbuild binary
        run: npm rebuild esbuild --ignore-scripts=false

      - name: Test
        run: npm test

  integration-test:
    name: integration-test (scrcpy ${{ matrix.scrcpy-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint-and-build, test]
    strategy:
      # The two versions exercise different wire formats, so a failure in one
      # says nothing about the other -- cancelling the sibling would just hide
      # half the answer.
      fail-fast: false
      matrix:
        # videoMetaLayout() branches at scrcpy 4.0: 4.x sends an 80-byte device
        # meta header, earlier versions the shorter one. One version on each
        # side of that branch keeps both paths covered against a real device.
        #
        # Pinned rather than tracking "latest" because each download is checked
        # against its published SHA256 (from the release's SHA256SUMS.txt), and
        # because an upstream release should never be able to turn an unrelated
        # PR red on its own. Bump deliberately when supporting a new version.
        #
        # The version is deliberately not exported as SCRCPY_SERVER_VERSION:
        # the MCP server reads that name at runtime and it overrides version
        # detection, which would stop the run from exercising the ladder.
        include:
          - scrcpy-version: "3.3.4"
            scrcpy-sha256: "0305d98c06178c67e12427bbf340c436d0d58c9e2a39bf9ffbbf8f54d7ef95a5"
          - scrcpy-version: "4.1"
            scrcpy-sha256: "ad56ae8bfeedf41e824945c11dbf55fcb092b3e615b9b486f48a50e30d389635"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild esbuild binary
        run: npm rebuild esbuild --ignore-scripts=false

      - name: Build
        run: npm run build

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-30-x86_64-${{ runner.os }}-v1

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b
        with:
          api-level: 30
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      # Install scrcpy the way a user does: the official release archive, client
      # and server together, discovered through PATH. Downloading the server jar
      # on its own and pointing SCRCPY_SERVER_PATH at it would test a shape
      # almost nobody runs, and would skip the client/server pairing entirely.
      # The portable Linux build needs only libudev and libcap, both already on
      # the runner, so no apt install is required.
      - name: Install scrcpy
        run: |
          ARCHIVE=scrcpy-linux-x86_64-v${{ matrix.scrcpy-version }}
          curl --fail -L -o /tmp/scrcpy.tar.gz \
            https://github.com/Genymobile/scrcpy/releases/download/v${{ matrix.scrcpy-version }}/$ARCHIVE.tar.gz
          echo "${{ matrix.scrcpy-sha256 }}  /tmp/scrcpy.tar.gz" | sha256sum --check
          mkdir -p ~/.local/opt
          tar -xzf /tmp/scrcpy.tar.gz -C ~/.local/opt
          # The archive bundles its own adb; drop it so the emulator keeps
          # talking to the runner's platform-tools adb.
          rm -f ~/.local/opt/$ARCHIVE/adb
          echo "$HOME/.local/opt/$ARCHIVE" >> "$GITHUB_PATH"

      - name: Verify scrcpy resolves as a pair
        run: |
          which scrcpy
          scrcpy --version
          test -f "$(dirname "$(which scrcpy)")/scrcpy-server"

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b
        with:
          api-level: 30
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb wait-for-device
            adb devices -l
            echo "Waiting for Android boot to complete..."
            timeout 120 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'
            npm run test:integration
